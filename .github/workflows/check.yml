name: Research bench checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  model-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic model tests
        run: node --test tests/*.test.mjs
      - name: Check module syntax
        run: |
          node --check src/engine.mjs
          node --check assets/app.js
          node --check src/energy.mjs
          node --check src/supervisor.mjs
          node --check src/twin.mjs
          node --check assets/supervisor.js
          node --check assets/closetvault.js
          node --check assets/twin.js
          node --check src/fixture-bench.mjs
          node --check assets/fixture-bench.js
          node --check src/evidence.mjs
          node --check assets/evidence.js
          node --check src/study-plan.mjs
          node --check assets/study.js
          node --check src/preflight.mjs
          node --check assets/preflight.js
          node --check src/observations.mjs
          node --check assets/observations.js
